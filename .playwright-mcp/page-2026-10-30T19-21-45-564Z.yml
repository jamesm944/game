  - generic [ref=f176e21]:
    - generic [ref=f176e22]:
      - paragraph [ref=f176e23]: Current direction
      - heading "D · Crown & Chronicle" [level=2] [ref=f176e24]
      - paragraph [ref=f176e25]: The synthesis to judge against these references. AoE4 skeleton, but built for a settlement sim rather than an army.
      - list [ref=f176e26]:
        - listitem [ref=f176e27]: "One 60px top bar: crest, seven resources, epoch, speed, alerts, pause."
        - listitem [ref=f176e28]: "One tabbed info panel: Commission / Victory / People."
        - listitem [ref=f176e29]: "One bottom deck: minimap · commands · training queue · inspector."
        - listitem [ref=f176e30]: "Sim depth on demand: People tab and Pop inspector, not permanent rails."
    - figure "D at 1600×900 — the state to compare every reference against." [ref=f176e31]:
      - img "D Crown and Chronicle at 1600 by 900" [ref=f176e32]
  - generic [ref=f176e34]:
    - article [ref=f176e35]:
      - heading "One bar, one deck" [level=3] [ref=f176e36]
      - paragraph [ref=f176e37]: AoE4 · AoE2 DE · AoM Retold
      - paragraph [ref=f176e38]: A single resource line on top and a single command deck on the bottom. Everything else is contextual. This is D's skeleton.
    - article [ref=f176e39]:
      - heading "Edge-hugging, no rails" [level=3] [ref=f176e40]
      - paragraph [ref=f176e41]: Company of Heroes 3 · Northgard
      - paragraph [ref=f176e42]: Tactical map, unit cards and alerts pinned to the corners. The playfield is never framed by full-height panels.
    - article [ref=f176e43]:
      - heading "Panel-first sim depth" [level=3] [ref=f176e44]
      - paragraph [ref=f176e45]: Manor Lords · Against the Storm · Frostpunk 2
      - paragraph [ref=f176e46]: Mood, needs, production and factions live in slide-in panels or one side column, opened on demand. The map stays readable.
    - article [ref=f176e47]:
      - heading "Character-first right rail" [level=3] [ref=f176e48]
      - paragraph [ref=f176e49]: "TW: THREE KINGDOMS · TW: WARHAMMER III"
      - paragraph [ref=f176e50]: Portraits, relationships and retinues get a dedicated right-hand surface. Good model for a People tab that is more than a list.
