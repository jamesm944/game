  - generic [ref=f175e21]:
    - generic [ref=f175e22]:
      - paragraph [ref=f175e23]: Current direction
      - heading "D · Crown & Chronicle" [level=2] [ref=f175e24]
      - paragraph [ref=f175e25]: The synthesis to judge against these references. AoE4 skeleton, but built for a settlement sim rather than an army.
      - list [ref=f175e26]:
        - listitem [ref=f175e27]: "One 60px top bar: crest, seven resources, epoch, speed, alerts, pause."
        - listitem [ref=f175e28]: "One tabbed info panel: Commission / Victory / People."
        - listitem [ref=f175e29]: "One bottom deck: minimap · commands · training queue · inspector."
        - listitem [ref=f175e30]: "Sim depth on demand: People tab and Pop inspector, not permanent rails."
    - figure "D at 1600×900 — the state to compare every reference against." [ref=f175e31]:
      - img "D Crown and Chronicle at 1600 by 900" [ref=f175e32]
  - generic [ref=f175e34]:
    - article [ref=f175e35]:
      - heading "One bar, one deck" [level=3] [ref=f175e36]
      - paragraph [ref=f175e37]: AoE4 · AoE2 DE · AoM Retold
      - paragraph [ref=f175e38]: A single resource line on top and a single command deck on the bottom. Everything else is contextual. This is D's skeleton.
    - article [ref=f175e39]:
      - heading "Edge-hugging, no rails" [level=3] [ref=f175e40]
      - paragraph [ref=f175e41]: Company of Heroes 3 · Northgard
      - paragraph [ref=f175e42]: Tactical map, unit cards and alerts pinned to the corners. The playfield is never framed by full-height panels.
    - article [ref=f175e43]:
      - heading "Panel-first sim depth" [level=3] [ref=f175e44]
      - paragraph [ref=f175e45]: Manor Lords · Against the Storm · Frostpunk 2
      - paragraph [ref=f175e46]: Mood, needs, production and factions live in slide-in panels or one side column, opened on demand. The map stays readable.
    - article [ref=f175e47]:
      - heading "Character-first right rail" [level=3] [ref=f175e48]
      - paragraph [ref=f175e49]: "TW: THREE KINGDOMS · TW: WARHAMMER III"
      - paragraph [ref=f175e50]: Portraits, relationships and retinues get a dedicated right-hand surface. Good model for a People tab that is more than a list.
