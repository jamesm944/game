[package]
name = "ageofwind-sim"
version = "0.1.0"
edition = "2024"
publish = false
description = "Ageofwind authoritative simulation core (Rust, ADR-0008)"

[dependencies]
flate2 = "1.1.11"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shipyard = { version = "0.11.5", features = ["parallel"] }
tiny_http = "0.12"
